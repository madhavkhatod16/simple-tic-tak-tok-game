<!DOCTYPE html>
<html>
<head>
<title>Tic Tac Toe</title>
		<style>
		body{
			background:black;
			font-family:Arial;
			text-align:center;
			color:white;
		}

		h2{
			color:#00ffff;
			font-size:40px;
			text-shadow:0 0 3px #00ffff,
		}

		table{
			margin:auto;
			border-collapse:collapse;
			box-shadow:0 0 3px #00ffff;
		}

		td{
			width:100px;
			height:100px;
			border:1.5px solid #00ffff;
			text-align:center;
			font-size:55px;
			font-weight:bold;
			cursor:pointer;
			transition:0.3s;
		}

		td:hover{
			background:#111;
			box-shadow:inset 0 0 5px #00ffff;
		}

		#msg{
			font-size:25px;
			margin:20px;
			color:#39ff14;
			text-shadow:0 0 3px #39ff14;
		}

		button{
			background:black;
			color:#39ff14;
			border:1px solid #39ff14;
			padding:12px 25px;
			font-size:18px;
			border-radius:10px;
			cursor:pointer;
			box-shadow:0 0 5px #39ff14;
		}

		button:hover{
			background:#39ff14;
			color:black;
		}
		</style>
</head>

<body>
<h2>TIC TAC TOE</h2>
<table>
<tr>
    <td id="0" onclick="play(0)"></td>
    <td id="1" onclick="play(1)"></td>
    <td id="2" onclick="play(2)"></td>
</tr>
<tr>
    <td id="3" onclick="play(3)"></td>
    <td id="4" onclick="play(4)"></td>
    <td id="5" onclick="play(5)"></td>
</tr>
<tr>
    <td id="6" onclick="play(6)"></td>
    <td id="7" onclick="play(7)"></td>
    <td id="8" onclick="play(8)"></td>
</tr>
</table>
<h3 id="msg">Player X Turn</h3>
<button onclick="resetgame()">Reset Game</button>
<script>
var board = ["","","","","","","","",""];
var player = "X";
var gameover = false;
function play(p){
    if(board[p]=="" && !gameover){
        board[p]=player;
        if(player=="X"){
            document.getElementById(p).innerHTML = "<span style='color:#00ffff;text-shadow:0 0 5px #00ffff;'>X</span>";
        }
        else{
            document.getElementById(p).innerHTML = "<span style='color:#ff0000;text-shadow:0 0 5px #ff0000'>O</span>";
        }
        checkwinner();
        if(!gameover){
				checktie();
        }
        if(!gameover){
            if(player=="X"){
                player="O";
            }
            else{
                player="X";
            }
            document.getElementById("msg").innerHTML =
            "Player " + player + " Turn";
        }
    }
}

function checkwinner(){
    var win = [ [0,1,2],[3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]];
    for(var i=0;i<win.length;i++){
        var a=win[i][0];
        var b=win[i][1];
        var c=win[i][2];
        if(board[a]!="" &&  board[a]==board[b] && board[b]==board[c]){
            document.getElementById("msg").innerHTML =" Player " + player + " Wins!";
            gameover=true;
        }
    }
}
function checktie(){
    var count=0;
    for(var i=0;i<9;i++){
        if(board[i]!=""){
            count++;
        }
    }
    if(count==9){
        document.getElementById("msg").innerHTML =" Match Tie!";
        gameover=true;
    }
}

function resetgame(){
    board=["","","","","","","","",""];
    for(var i=0;i<9;i++){
        document.getElementById(i).innerHTML="";
    }
    player="X";
    gameover=false;
    document.getElementById("msg").innerHTML =
    "Player X Turn" ;
}
</script>
</body>
</html>
